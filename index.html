<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Card Canvas —— 卡片笔记与无限白板，实体与投影解耦的本地优先工作台。"
    />
    <meta name="application-name" content="Card Canvas" />
    <meta name="apple-mobile-web-app-title" content="Card Canvas" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#f7f6f3" />
    <title>Card Canvas · 卡片笔记与无限白板</title>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('card-canvas-theme')
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          const isDark =
            stored === 'dark' || (stored !== 'light' && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', isDark ? '#09090b' : '#f7f6f3')
        } catch {
          // Storage can be unavailable in restricted browsing contexts.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
